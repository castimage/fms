# FMS 财务管理系统， 单机集群形态编排，多后端实例 + 数据库主从
# 【形态】与 docker-compose.yml 互斥的集群形态（项目名 name: fms，单机形态为
#       name: fms-single，两者不同名，防止用单机文件对集群部署执行
#       up/--force-recreate 时静默接管网关上游）。差异，
#   1. fms-backend 拆为 fms-backend-1 / fms-backend-2 双实例（同一
#      ./fms_backend 构建、各自 healthcheck，附件卷 fms-files 两实例挂同一
#      命名卷，单机共享 OK，多机部署须换共享存储，见文件末「部署风险」），
#   2. 会话/防重放/黑名单等共享状态收敛于 fms-redis（FMS_SESSION_STORE:
#      redis），双实例会话一致性的硬依赖，不得改回 in-memory，
#   3. 数据源统一经 fms-pgbouncer:6432（transaction 池），后端不直连主库，
#   4. fms-db-replica 从库（pg_basebackup + 流复制，standby 只读），
#      主库 init 以 FMS_REPL_PASSWORD 创建 replicator 角色，前置条件，
#   5. fms-rgw 以 FMS_RGW_UPSTREAM_SERVERS 注入双上游 + mode: auto
#      （auto = least-conn + 自动健康管理，实例故障自动摘除）。
#   【互斥】单机形态（docker-compose.yml）与集群形态不得同机并存，两形态
#   container_name 相同（fms-db/fms-pgbouncer/fms-redis/fms-rgw/fms-web-build），
#   同机混跑会因容器名冲突快速失败，网关 8443 端口也只允许一个形态占用。
#   切换形态，先 docker compose -f docker-compose.yml down（或本文件 down），
#   再以另一形态 up。生产部署以本文件，集群形态为准。
# 【include 取舍，显式完整定义，不采用 include: [docker-compose.yml]】
#   include（compose ≥2.24）只能按 merge 语义叠加，无法表达集群差异，
#   - 无法"删除"基础文件的 fms-backend 单实例服务，若保留将与
#     fms-backend-1/2 并存，且 fms-rgw 的 depends_on 仍指向死服务，
#   - environment 合并只能增改键，无法移除 FMS_RGW_UPSTREAM 死引用
#     （servers 非空时虽优先，但留死引用会误导排障），
#   - fms-backend-1/2 因新服务名本就需全量定义，include 省下的部分
#     （db/rgw/web-build）同样要按集群差异逐处改写。
#   故显式完整定义，一份文件自洽、无隐式合并陷阱，代价是与
#   docker-compose.yml 同步维护（差异见上，新增/修改服务时两处都要同步，
#   本文件是它的集群超集，除 backend 拆分/主从/网关双上游外完全一致）。
#   版本要求，仅需 docker compose v2 常规能力，不依赖 2.24+ 的 include。
# 【前置】同 docker-compose.yml（.env 必填 FMS_REDIS_PASSWORD 等），额外
#   必填 FMS_REPL_PASSWORD，fms_init.sh 末段以该值创建 replicator
#   角色、对齐密码并追加 pg_hba 复制授权，从库 basebackup 的前置条件。
# 【项目名】显式 name: fms（与目录名默认一致，目录改名不影响既有部署的
#   容器归属，与单机形态 name: fms-single / 多机形态 name: fms-multi 互斥，
#   杜绝 -f 混用/--force-recreate 跨形态接管）。

name: fms

# 共享日志策略锚点（与 docker-compose.yml 一致）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# 后端双实例共享环境锚点（两实例 environment 完全一致，仅 container_name/
# depends_on 不同，见 fms-backend-1/2，此处集中维护避免双份漂移）
x-backend-env: &backend-env
  # 数据源经 fms-pgbouncer:6432（transaction 池）而非直连主库，
  # 双实例共享同一连接池语义（DISCARD ALL 复位），pgbouncer 把 Hikari
  # 连接数上限从 PG 后端连接数解耦
  # prepareThreshold=0，PgBouncer transaction 池不支持服务端预编译语句
  # （PG JDBC 默认 prepareThreshold=5 触发 PREPARE 协议报错），禁用后客户端模拟
  SPRING_DATASOURCE_URL: jdbc:postgresql://fms-pgbouncer:6432/fms?prepareThreshold=0
  SPRING_DATASOURCE_USERNAME: fms_app
  SPRING_DATASOURCE_PASSWORD: ${FMS_DB_PASSWORD:?请在 .env 设置 FMS_DB_PASSWORD}
  # 从库只读分流，readOnly=true 事务，报表等查询经 fms-pgbouncer-ro → 从库，
  # 写事务/非事务查询走主库（RoutingDataSource 按事务只读标志路由）
  FMS_DATASOURCE_RO_ENABLED: "true"
  FMS_DATASOURCE_RO_URL: jdbc:postgresql://fms-pgbouncer-ro:6432/fms?prepareThreshold=0
  # 与网关共享的 HMAC 对称密钥（FMS_JWT_SECRET/FMS_RGW_JWT_SECRET 同值）
  FMS_JWT_SECRET: ${FMS_JWT_SECRET:?请在 .env 设置 FMS_JWT_SECRET}
  # 与网关共享的请求签名密钥（FMS_SIGN_SECRET/FMS_RGW_SIGN_SECRET 同值）
  FMS_SIGN_SECRET: ${FMS_SIGN_SECRET:?请在 .env 设置 FMS_SIGN_SECRET}
  # 恒为 false，签名校验必须前置网关，禁止绕过
  FMS_SECURITY_BYPASS_GATEWAY: "false"
  # 网关内部端点 token（可选，默认空 = 内部端点禁用 fail-closed）
  FMS_INTERNAL_TOKEN: ${FMS_INTERNAL_TOKEN:-}
  # 共享会话存储，双实例 nonce/票据/黑名单/WS 广播经 redis 同步
  # （SPRING_DATA_REDIS_* 宽松绑定环境变量，优先级高于 application.yaml）
  SPRING_DATA_REDIS_HOST: fms-redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: ${FMS_REDIS_PASSWORD:?请在 .env 设置 FMS_REDIS_PASSWORD}
  FMS_SESSION_STORE: redis
  # JVM 堆上限，双实例内存大头，防单实例吃满宿主机
  JAVA_TOOL_OPTIONS: -Xmx2g -Xms1g
  # 集群对等实例列表，compose 服务名（DNS 别名），多实例综合信息经 /internal/cluster-info 聚合
  FMS_CLUSTER_PEERS: fms-backend-1:8081,fms-backend-2:8081
  # 附件本地卷目录（fms-files 命名卷，两实例共享）
  FMS_FILE_STORAGE_DIR: /app/data/files
  # 邮件接入，可选，默认不发送，SMTP 配置后找回密码邮件自动生效，未配置静默跳过
  FMS_SMTP_HOST: ${FMS_SMTP_HOST:-}
  FMS_SMTP_PORT: ${FMS_SMTP_PORT:-465}
  FMS_SMTP_USERNAME: ${FMS_SMTP_USERNAME:-}
  FMS_SMTP_PASSWORD: ${FMS_SMTP_PASSWORD:-}

networks:
  # 与 docker-compose.yml 同一 bridge 网络（单机共享，多机部署时本文件
  # 不适用，跨宿主会话一致性需外部 redis/pgbouncer，走 multi 形态）
  fms-network:
    driver: bridge

volumes:
  # 主库数据卷
  fms-db-data:
  fms-pglog:
  # 从库数据卷（pg_basebackup 全量副本 + WAL 持久化）
  fms-db-replica-data:
  # Redis AOF 持久化卷，共享会话存储
  fms-redis-data:
  # 前端构建产物卷（fms-web-build 写入、fms-rgw 只读）
  fms-static:
  # 网关访问日志卷
  fms-logs:
  # 附件存储卷（两后端实例共享同一命名卷，单机共享 OK）
  fms-files:

services:
  # fms-db， 主库（与 docker-compose.yml 一致，仅增 FMS_REPL_PASSWORD）
  fms-db:
    build: ./deploy/pg
    image: fms-postgres:18
    container_name: fms-db
    networks:
      - fms-network
    restart: unless-stopped
    # 不发布宿主机端口，仅 fms-network 内可达，签名校验必须前置网关
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      # init 脚本（fms_init.sh）末尾以该值 ALTER ROLE fms_app 对齐 .env 密码
      FMS_DB_PASSWORD: ${FMS_DB_PASSWORD:?请在 .env 设置 FMS_DB_PASSWORD}
      # init 脚本以该值对齐 sec.app_secrets.jwt.secret
      FMS_JWT_SECRET: ${FMS_JWT_SECRET:?请在 .env 设置 FMS_JWT_SECRET}
      # 列加密主密钥外部注入（可选，空 = seed 内建占位值，注入须早于种子数据加密写入）
      FMS_MASTER_KEY: ${FMS_MASTER_KEY:-}
      # 集群差异，init 脚本末段以该值创建 replicator 角色（LOGIN+REPLICATION）、
      # 对齐密码并追加 pg_hba 复制授权，fms-db-replica 执行 pg_basebackup
      # 的前置条件（幂等，角色 IF NOT EXISTS / 授权行 grep 判重）
      FMS_REPL_PASSWORD: ${FMS_REPL_PASSWORD:?请在 .env 设置 FMS_REPL_PASSWORD}
    volumes:
      # PG18 官方镜像数据目录为 /var/lib/postgresql/18/docker 子路径，必须挂父目录
      - fms-db-data:/var/lib/postgresql
      # PG 日志独立卷（pgaudit 审计日志随 PG 日志落盘，供外部采集/归档）
      - fms-pglog:/var/log/postgresql
      # SQL 脚本源（只读，供 init 脚本按 00→…→08 顺序 source 执行）
      - ./fms_db_pg:/fms-init:ro
      # 唯一 init 入口，只读挂载进官方镜像初始化目录
      - ./deploy/init/fms_init.sh:/docker-entrypoint-initdb.d/fms_init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 20s
      retries: 10
      start_period: 30s
    logging: *default-logging

  # fms-pgbouncer， transaction 连接池（与 docker-compose.yml 完全一致）
  fms-pgbouncer:
    build: ./deploy/pgbouncer
    image: fms-pgbouncer:1.24
    container_name: fms-pgbouncer
    networks:
      - fms-network
    restart: unless-stopped
    environment:
      # 生成 userlist.txt 的两用户密码（entrypoint 明文写入 userlist.txt，
      # 故 .env 密码应避免双引号，见 deploy/pgbouncer/entrypoint.sh）
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      FMS_DB_PASSWORD: ${FMS_DB_PASSWORD:?请在 .env 设置 FMS_DB_PASSWORD}
      # 单机集群，主库在同一 fms-network，服务名 fms-db 即可
      DB_HOST: fms-db
    depends_on:
      # 等主库初始化完成（含 replicator 角色与 pg_hba 授权）再对外供池
      fms-db:
        condition: service_healthy
    healthcheck:
      # 探活经池直连后端执行 SELECT 1（比 SHOW VERSION 更真实，同时验证 pgbouncer 建连与主库可达），
      # $${...} 容器内展开（healthcheck 继承服务 environment）
      test: ["CMD-SHELL", "PGPASSWORD=$${FMS_DB_PASSWORD} psql -h 127.0.0.1 -p 6432 -U fms_app -d fms -tAc 'SELECT 1'"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    logging: *default-logging

  # fms-pgbouncer-ro， 只读池，从库只读分流，transaction 池连从库 standby，
  # 供后端 readOnly=true 事务，报表/查询路由，写路径仍走 fms-pgbouncer 主库池
  fms-pgbouncer-ro:
    build: ./deploy/pgbouncer
    image: fms-pgbouncer:1.24
    container_name: fms-pgbouncer-ro
    networks:
      - fms-network
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      FMS_DB_PASSWORD: ${FMS_DB_PASSWORD:?请在 .env 设置 FMS_DB_PASSWORD}
      # 连接目标为从库（standby 只读，pg_basebackup 完成后才可连）
      DB_HOST: fms-db-replica
    depends_on:
      fms-db-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$${FMS_DB_PASSWORD} psql -h 127.0.0.1 -p 6432 -U fms_app -d fms -tAc 'SELECT 1'"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: *default-logging

  # fms-redis， 共享会话存储（与 docker-compose.yml 完全一致）
  fms-redis:
    image: redis:7-alpine
    container_name: fms-redis
    networks:
      - fms-network
    restart: unless-stopped
    # command 内 ${...} 由 compose 解析期从 .env 展开（exec argv 需实值），
    # healthcheck 内 $${...} 双重转义留待容器 shell 展开（见 docker-compose.yml）
    command:
      - redis-server
      - --requirepass
      - "${FMS_REDIS_PASSWORD:?请在 .env 设置 FMS_REDIS_PASSWORD}"
      - --appendonly
      - "yes"
    environment:
      # 注入供 healthcheck 使用（healthcheck 继承服务 environment）
      FMS_REDIS_PASSWORD: ${FMS_REDIS_PASSWORD:?请在 .env 设置 FMS_REDIS_PASSWORD}
    volumes:
      # AOF 持久化目录（appendonly yes，双实例共享会话不因重启丢失）
      - fms-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${FMS_REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s
    logging: *default-logging

  # fms-backend-1 / fms-backend-2， 后端双实例（同一 ./fms_backend 构建）
  # 职责/健康检查/重启策略与 docker-compose.yml fms-backend 一致，environment
  # 来自共享锚点 x-backend-env（两实例同构，会话经 redis 同步，流量经网关
  # 按 least-conn 分发）。
  fms-backend-1:
    build: ./fms_backend
    container_name: fms-backend-1
    networks:
      - fms-network
    restart: unless-stopped
    environment: *backend-env
    volumes:
      # 附件存储命名卷，两实例挂同一命名卷（单机共享 OK，多机需共享存储，
      # 见文件末「部署风险」）
      - fms-files:/app/data/files
    depends_on:
      # 等连接池与共享存储就绪再启动（pgbouncer 已依赖主库健康）
      fms-pgbouncer:
        condition: service_healthy
      fms-pgbouncer-ro:
        condition: service_healthy
      fms-redis:
        condition: service_healthy
    # 严禁挂载 fms_backend/config 目录（同 docker-compose.yml 说明）
    healthcheck:
      # /internal/health 经 GatewaySignatureFilter 免签名，可被 compose 探测
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/internal/health"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging

  fms-backend-2:
    build: ./fms_backend
    container_name: fms-backend-2
    networks:
      - fms-network
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - fms-files:/app/data/files
    depends_on:
      fms-pgbouncer:
        condition: service_healthy
      fms-pgbouncer-ro:
        condition: service_healthy
      fms-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/internal/health"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # fms-backend， 合并栈守卫占位服务（默认不启动，勿手工 up）
  # 职责，机械化杜绝"用 -f docker-compose.yml -f docker-compose.cluster.yml
  #       合并两文件"的误操作（合并栈把基础文件的独立 fms-backend
  #       单实例并入项目 fms，形成 8+1 容器混跑、网关上游回落
  #       http://fms-backend:8081 陈旧单实例的部署漂移）。Compose 合并规则，
  #       同服务名后文件覆盖前文件，合并栈中本占位定义会替换基础文件的真实
  #       fms-backend，且本服务带 profiles: [fms-merge-guard]，未显式
  #       --profile fms-merge-guard 时不会启动/构建，合并栈因此只剩集群形态
  #       的 7 个运行容器，多余单实例后端永远无法被拉起。
  #       纯集群部署（-f 本文件）时本服务同样不启动，无任何影响。
  fms-backend:
    image: busybox:stable
    profiles: ["fms-merge-guard"]
    restart: "no"
    command: ["true"]

  # fms-web-build， 前端构建一次性服务（与 docker-compose.yml 完全一致）
  fms-web-build:
    build: ./fms_web
    container_name: fms-web-build
    volumes:
      # 构建产物写入命名卷（fms_web/Dockerfile ENTRYPOINT: cp -r /app/dist/. /static/）
      - fms-static:/static
    restart: "no"
    networks:
      - fms-network

  # fms-db-replica， 从库（standby，只读）
  # 复用主库定制镜像 fms-postgres:18（业务扩展随 pg_basebackup 从主库带来，
  # 免二次构建），覆盖 entrypoint 为挂载脚本 entrypoint-replica.sh（等待主库
  # 就绪 → pg_basebackup -R -X stream → standby.signal → exec postgres）。
  # 不发布端口，仅 fms-network 内可访问，healthcheck 仅验进程存活
  # （pg_isready 不校验复制延迟）。
  fms-db-replica:
    image: fms-postgres:18
    container_name: fms-db-replica
    networks:
      - fms-network
    restart: unless-stopped
    # 以 /bin/sh 前缀执行，Windows/Docker Desktop 下 bind mount 文件无执行位
    # 时仍可运行（挂载脚本 :ro，无需 chmod，与 docker-compose.pg-repl.yml 一致）
    entrypoint: ["/bin/sh", "/entrypoint-replica.sh"]
    volumes:
      # PG18 官方镜像数据目录为 /var/lib/postgresql/18/docker 子路径，必须挂父目录
      - fms-db-replica-data:/var/lib/postgresql
      - ./deploy/pg-replica/entrypoint-replica.sh:/entrypoint-replica.sh:ro
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      # 复制用户密码（entrypoint 读 REPL_PASSWORD，缺省回退本变量）
      FMS_REPL_PASSWORD: ${FMS_REPL_PASSWORD:?请在 .env 设置 FMS_REPL_PASSWORD}
      REPL_USER: replicator
      PRIMARY_HOST: fms-db
      PRIMARY_PORT: "5432"
    depends_on:
      # 等主库初始化完成（含 replicator 角色与 pg_hba 复制授权）再 basebackup
      fms-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
    logging: *default-logging

  # fms-rgw， Rust 网关（8443 TLS 入口，唯一对外服务）
  # 与 docker-compose.yml 一致，仅差异为上游采用双实例 servers +
  # mode auto，见下方环境变量，depends_on 指向双后端实例。
  fms-rgw:
    build: ./fms_rgw
    image: fms_rgw:0.1.0
    container_name: fms-rgw
    networks:
      - fms-network
    restart: unless-stopped
    # 唯一对外端口（TLS 入口），浏览器/客户端一律先过网关再做签名校验
    ports:
      - "8443:8443"
    volumes:
      # 前端 dist（方案 A，只读静态承载，与 fms-web-build 共用命名卷）
      - fms-static:/app/static:ro
      # 网关配置覆盖镜像内模板（cors.allowed_origins 必须非空）
      - ./deploy/fms_rgw.yaml:/app/config/fms_rgw.yaml:ro
      # TLS 自签证书只读挂载（缺失 → 启动失败，不依赖 HEALTHCHECK 兜底）
      - ./deploy/certs:/app/certs:ro
      # 访问日志命名卷
      - fms-logs:/app/logs
    environment:
      FMS_RGW_CONFIG: /app/config/fms_rgw.yaml
      FMS_RGW_LISTEN: 0.0.0.0:8443
      # 集群差异，不设 FMS_RGW_UPSTREAM，servers 非空时优先于 base_url
      # （config.rs apply_env_overrides，有效服务器列表 = servers 非空 ?
      # servers : vec![base_url]），部署件 base_url 在集群形态是死配置，
      # auto = least-conn + 自动健康管理（health_path /internal/health 逐
      # 实例探测，故障实例自动摘除）
      FMS_RGW_UPSTREAM_MODE: auto
      FMS_RGW_UPSTREAM_SERVERS: http://fms-backend-1:8081,http://fms-backend-2:8081
      # 与后端共享密钥（网关 lib.rs:47-68 校验 ≥32 字符且非占位符，违者 exit，1）
      FMS_RGW_JWT_SECRET: ${FMS_JWT_SECRET:?请在 .env 设置 FMS_JWT_SECRET}
      FMS_RGW_SIGN_SECRET: ${FMS_SIGN_SECRET:?请在 .env 设置 FMS_SIGN_SECRET}
      FMS_RGW_STATIC_DIR: /app/static
      FMS_RGW_LOG_FILE: /app/logs/access.log
      # PGMQ 审计链路内部 token（必须与后端 FMS_INTERNAL_TOKEN 同值）
      FMS_RGW_LOG_TOKEN: ${FMS_INTERNAL_TOKEN:-}
    depends_on:
      # 等双后端实例健康且前端产物就绪再启动
      fms-backend-1:
        condition: service_healthy
      fms-backend-2:
        condition: service_healthy
      fms-web-build:
        condition: service_completed_successfully
    # 不重复定义 healthcheck，沿用镜像内置（每 30s 探测 /healthz）
    logging: *default-logging

# 【部署风险】
#   1. 附件卷 fms-files 为单机命名卷，fms-backend-1/2 同机共享 OK，若未来
#      拆分多机，附件须换共享存储（NFS/S3/对象存储），并同步改造
#      FMS_FILE_STORAGE_DIR 指向。
#   2. 会话一致性依赖 fms-redis 单点，redis 故障时双后端 fail-closed
#      （timeout 3s 快速失败），生产集群须为 redis 加哨兵/集群。
#   3. fms-db 与 fms-db-replica 同机竞争 IO/内存，仅作演练形态，真生产
#      主从请参考 docker-compose.pg-repl.yml 拆独立主机。
#   4. 部署形态互斥，本文件（name: fms）与 docker-compose.yml
#      （name: fms-single）/ docker-compose.multi.yml（name: fms-multi）
#      是三种互斥形态。任何人不得用 docker-compose.yml 对本集群部署执行
#      "up -d --force-recreate"，项目名不同后该命令只会创建/作用到
#      fms-single 项目，并因 container_name 冲突快速失败，不会
#      把网关 fms-rgw 重建为单上游（丢失 FMS_RGW_UPSTREAM_SERVERS 导致
#      上游漂移到陈旧单实例 fms-backend）。运维命令一律带 -f 明确形态文件，
#         docker compose -f docker-compose.cluster.yml up -d --force-recreate fms-rgw
#   5. 严禁用 "-f docker-compose.yml -f docker-compose.cluster.yml" 合并两
#      文件执行 up/--force-recreate，合并栈的项目名取后文件（fms），基础
#      文件的 fms-backend 单实例会被并入集群项目（见上方守卫占位
#      服务说明）。合并栈虽因项目名不同不会再覆盖网关 env，但仍会多拉起
#      一个独立 fms-backend（重复消费 pgmq/定时任务）。守卫占位服务保证
#      该单实例永远无法启动，若仍误操作，检查 docker compose ls -a 中项目
#      fms 的 CONFIG FILES 是否只含本文件，并删除多余容器，
#        docker rm -f fms-backend   # 仅当 docker inspect 确认其属于误合并
#        docker compose -f docker-compose.cluster.yml up -d   # 重录干净项目配置
