# fms_rgw（fms-gateway）模板配置：生产默认 TLS 8443、密钥占位待注入、上游 8081。
# 本地联调改 config/fms_rgw.local.yaml（FMS_RGW_CONFIG 指向），勿改本模板：
# config 测试断言本文件 listen=0.0.0.0:8443 且 allow_insecure_fallback=false

server:
  listen: "0.0.0.0:8443"
  # 并发连接上限（Semaphore 兼作 in-flight 计数，满则拒绝新连接），随机器规格与预期并发调整
  max_connections: 8192
  # 优雅关闭宽限期：停止 accept 后等待 in-flight 请求完成的最长时限，超时强制退出
  graceful_shutdown_secs: 10
  # 请求体上限（Content-Length 声明与实际缓冲双重校验，超限 413；WS 握手复用）：
  # 须与后端 fms.security.max-body-bytes 对齐，且恒大于 fms.file.max-size-bytes（8MB 留 multipart 余量）
  max_body_bytes: 10485760
  # ip 白名单（ip/CIDR 列表，如 ["10.0.0.0/8", "192.168.1.5"]）：空=放行全部，
  # 非空=仅白名单来源可访问 /api，其余 403 fail-closed；判定用真实对端 ip，伪造 XFF/X-Real-IP 不绕过；
  # /healthz 与静态资源豁免；生产可经 FMS_RGW_IP_ALLOWLIST（逗号分隔）注入，避免提交运维网段
  ip_allowlist: []
  # 响应体压缩（gzip/deflate/br/zstd 按 Accept-Encoding 协商，自动加 Vary；已压缩内容/图片/SSE/WS 升级跳过）
  compression:
    enabled: true
    min_length: 1024        # 低于此字节数的响应体不压缩
    level: 6                # 压缩级别 0-9（1 最快/9 最佳）

tls:
  cert: "/app/certs/fms_rgw.pem"
  key: "/app/certs/fms_rgw-key.pem"
  allow_insecure_fallback: false

upstream:
  base_url: "http://127.0.0.1:8081"
  request_timeout_secs: 30
  idle_timeout_secs: 60
  # 连接池每 host 空闲连接上限，配合 idle_timeout_secs 控制复用与回收
  pool_max_idle_per_host: 16
  health_path: "/internal/health"
  health_interval_secs: 5
  health_timeout_secs: 2

auth:
  jwt_secret: "change-me-at-least-32-chars-jwt-secret-0123456789"
  expected_iss: "fms"
  expected_aud: "fms-gateway"
  leeway_secs: 60
  # 登出黑名单回退 TTL：token 无法解析出 exp 时的默认到期时间，对齐后端 fms.jwt.access-ttl（默认 2h）
  logout_blacklist_ttl_secs: 7200
  allowed_roles:
    - "operator"
    - "viewer"
    - "auditor"
    - "report"
    - "admin"

sign:
  sign_secret: "change-me-at-least-32-chars-sign-secret-0123456789"

limits:
  ip_per_window: 100
  user_per_window: 200
  login_per_window: 10
  shards: 64
  max_keys: 100000
  # 限流滑动窗口时长（ip/用户/登录三维度共用，与上方每窗次数键配套）
  window_secs: 60
  # 限流表过期窗口与登出令牌黑名单过期条目的回收周期
  cleanup_interval_secs: 60
  # 限流跳过路径（前缀匹配）：静态资源/健康检查等不承载配额语义的路径不计入限流，max_connections Semaphore 仍兜底防连接耗尽
  skip_paths:
    - "/assets/"
    - "/healthz"
    - "/favicon"
    - "/internal/"

trace:
  # traceId 采样率（百分比语义：100=全量；10=确定性采样 10%，按请求序号 % 100 < rate 采样，可复现；未采样请求不注入 X-Trace-Id，日志 req_id 为空；与 log.sample_rate 独立）
  sample_rate: 10

circuit:
  error_threshold_pct: 50
  sample_window: 100
  min_samples: 20
  open_timeout_secs: 30
  half_open_probes: 5

ws:
  # 升级等待超时：上游返回 101 后对端迟迟未完成升级时清理任务与连接，防连接耗尽 DoS
  upgrade_timeout_secs: 10

cors:
  allowed_origins:
    - "http://localhost:5173"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "PATCH"
    - "OPTIONS"
  allowed_headers:
    - "Authorization"
    - "Content-Type"
    - "X-Trace-Id"
    - "X-Requested-With"
  expose_headers:
    - "X-Trace-Id"
  max_age_secs: 86400

static:
  dir: "./static"
  # Cache-Control：带 hash 文件名资源的 max-age（默认 1 年，按发布节奏收紧；index.html no-store 属 SPA 更新语义，不配置化）
  hash_max_age_secs: 31536000
  # Cache-Control：普通非 hash 资源的 max-age（默认 1 小时）
  asset_max_age_secs: 3600

log:
  access_file: "logs/access.jsonl"
  level: "info"
  # 采样率（1=全量保审计；10=确定性采样 1/10，按请求序号 % rate == 0 记录，可复现）
  sample_rate: 1
  # 后台 sink 每批 flush 条目数（攒批后一次写文件并 flush）
  batch_size: 100
  # 条目不足 batch_size 时的最长攒批等待（毫秒，保实时性）
  batch_interval_ms: 500
  # 有界通道容量（满则丢弃并计数，日志可丢、请求不可受影响）
  channel_capacity: 10000
  # path/ua 字段最大长度（字符，防日志注入与超长 query 撑爆日志行或 pgmq 消息；与后端 fms.log.path-max-len / ua-max-len 同值，后端兜底截断）
  path_max_len: 1024
  ua_max_len: 256
  pgmq:
    # 网关批量 POST 后端 {endpoint}（该路径豁免网关签名但校验内部 token），
    # 后端 pgmq.send("q_log_access") 后由 cron 消费落 log.access_logs；网关不直连 PG/pgmq
    enabled: false          # 开启后访问日志经 http 中转投递 pgmq 供审计落库
    endpoint: "/internal/log-batch"   # 后端批量接收路径
    token: ""               # 内部 token（X-FMS-Int-Token），经 FMS_RGW_LOG_TOKEN 注入，留空禁用
    timeout_secs: 3         # 单次 http 投递超时（秒），经 FMS_RGW_LOG_TIMEOUT 覆盖
