# FMS PgBouncer 配置，transaction pooling
# [databases] 中 DB_HOST_PLACEHOLDER 由 entrypoint.sh 以环境变量 $DB_HOST
# 替换，默认 fms-db，多机/直连宿主场景把 DB_HOST 设为宿主 ip。
# compose 健康检查，需镜像含 postgresql-client，且运行用户 pgbouncer 可读
# PGPASSWORD 环境变量，psql -c "SHOW VERSION" 由 pgbouncer 自身应答，不经
# 后端，认证走本地 userlist，主库未就绪时仍可通过，只反映 pgbouncer 存活，
#   healthcheck:
#     test: ["CMD-SHELL", "PGPASSWORD=$${FMS_DB_PASSWORD} psql -h 127.0.0.1 -p 6432 -U fms_app -d fms -c 'SHOW VERSION'"]
#     interval: 5s
#     timeout: 10s
#     retries: 10
#     start_period: 10s

[databases]
fms = host=DB_HOST_PLACEHOLDER port=5432 dbname=fms

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

# transaction 池，每事务归还前执行 DISCARD ALL 重置会话，防止 SET ROLE /
# guc / 临时表跨事务残留泄漏到其他后端会话，与后端 Hikari 连接初始化
# sql "RESET ALL" 构成双重保险
pool_mode = transaction
server_reset_query = DISCARD ALL

max_client_conn = 2000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
server_lifetime = 3600
server_idle_timeout = 600

# 降噪，连接建立/断开不刷日志，避免高并发下日志洪泛
log_connections = 0
log_disconnections = 0

# pg jdbc 启动参数带 extra_float_digits，不忽略会直接拒绝连接
ignore_startup_parameters = extra_float_digits

# 容器内以 pgbouncer 用户运行，pid 落 /tmp 规避 /var/run 权限问题，
# logfile 留空，日志走 stdout，便于 docker logs 采集
pidfile = /tmp/pgbouncer.pid
