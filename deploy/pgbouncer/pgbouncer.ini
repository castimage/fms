# FMS PgBouncer 配置，transaction pooling。
# [databases] 的 DB_HOST_PLACEHOLDER 由 entrypoint.sh 以环境变量 $DB_HOST 替换，默认 fms-db；
# 多机或直连宿主场景把 DB_HOST 设为宿主 ip。
# compose 健康检查需镜像含 postgresql-client，且运行用户 pgbouncer 可读 PGPASSWORD；
# psql -c "SHOW VERSION" 由 pgbouncer 自身应答、不经后端，认证走本地 userlist，
# 主库未就绪时仍可通过，只反映 pgbouncer 存活。
#   healthcheck:
#     test: ["CMD-SHELL", "PGPASSWORD=$${FMS_DB_PASSWORD} psql -h 127.0.0.1 -p 6432 -U fms_app -d fms -c 'SHOW VERSION'"]
#     interval: 5s
#     timeout: 10s
#     retries: 10
#     start_period: 10s

[databases]
fms = host=DB_HOST_PLACEHOLDER port=5432 dbname=fms

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

# transaction 池逐事务执行 DISCARD ALL 复位会话，防 SET ROLE、GUC 与临时表随服务端连接复用
# 带进下一客户端的语句；server_reset_query_always 必须显式置 1（默认 0 时事务池不逐事务执行），
# 与后端 Hikari 初始化 SQL "RESET ALL" 构成双重保险
pool_mode = transaction
server_reset_query = DISCARD ALL
server_reset_query_always = 1

max_client_conn = 2000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
server_lifetime = 3600
server_idle_timeout = 600

# 降噪：连接建立/断开不刷日志，避免高并发下日志洪泛
log_connections = 0
log_disconnections = 0

# PG JDBC 启动参数带 extra_float_digits，不忽略会直接拒绝连接
ignore_startup_parameters = extra_float_digits

# 容器内以 pgbouncer 用户运行，logfile 留空、日志走 stdout 便于 docker logs 采集；
# 不设 pidfile：exec 启动即容器 PID 1、pid 恒为 1，重启后 /tmp 残留 pidfile 会被误判为活动实例而拒绝启动，
# 空值 pidfile 会被当作路径 open 而报错
