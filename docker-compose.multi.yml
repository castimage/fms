# FMS 财务管理系统， 多机部署编排（db 独立主机 + 应用主机，双机共用本文件）
# 【双机用法】
#   1. db 主机（PostgreSQL 独立机）执行，
#        docker compose -f docker-compose.multi.yml --profile db up -d
#      仅启动 fms-db 并发布 5432:5432 供应用主机直连，必须配合防火墙白名单
#      仅放行应用主机 IP。
#   2. 应用主机，后端 + 连接池 + 共享存储 + 网关 + 前端构建执行，
#        docker compose -f docker-compose.multi.yml --profile app up -d
#      启动 fms-backend / fms-redis / fms-pgbouncer / fms-web-build / fms-rgw，
#      应用主机 .env 必须设置 FMS_DB_HOST=<db 主机 LAN IP>（供本地 pgbouncer
#      指向 db 主机）。
#   3. 两主机各自创建独立的 fms-network（下方 networks 声明，互不相通），
#      跨主机通信仅经 db 主机的 5432 宿主端口。跨主机时 compose 服务名
#      fms-db 不可解析，故应用主机的 pgbouncer 以 FMS_DB_HOST（db 主机 LAN
#      IP）为连接目标，后端只连本地 pgbouncer:6432，数据面收敛于应用主机，
#      db 主机的 5432 宿主端口仅对应用主机 IP 放行，应用主机各服务必须
#      同机、同一 fms-network。
# 【与 docker-compose.yml 的差异】，未列出的服务定义与单机版完全一致
#   1. 全部服务增加 profiles 隔离，fms-db → ["db"]，fms-backend /
#      fms-redis / fms-pgbouncer / fms-web-build / fms-rgw → ["app"]，
#      保证应用主机不启动 db、db 主机不启动应用服务。
#   2. fms-db 增加 ports: ["5432:5432"]（仅 db 主机生效）。
#   3. 应用主机含 fms-redis，共享会话存储与 fms-pgbouncer（transaction
#      连接池），pgbouncer 的 DB_HOST 传 ${FMS_DB_HOST}（跨主机服务名
#      fms-db 不可解析，直连 db 主机 LAN IP），后端数据源指向本地
#      jdbc:postgresql://fms-pgbouncer:6432/fms（单机版为服务名 fms-pgbouncer，
#      语义一致，仅 pgbouncer 自身指向不同）。
#   4. fms-backend 的 depends_on fms-db 显式 required: false，compose ≥2.20
#      默认 required: true，依赖指向 profile 未激活服务会报错拒绝启动。
#      fms-pgbouncer 的 depends_on fms-db 同样 required: false。
# 【安全】应用主机仍只发布 8443:8443（TLS 入口），db 主机 5432 端口依赖
#       防火墙白名单收敛（仅应用主机 IP 可入），满足"签名校验必须前置网关"。
# 【项目名】显式 name: fms-multi（与单机形态 fms-single、集群形态 fms 互斥）。
#       多机形态两台主机各自独立 compose 项目（互不相通，仅经 db 主机
#       5432 宿主端口通信），不得与 docker-compose.yml / cluster 形态混跑，
#       否则 container_name 冲突快速失败。

name: fms-multi

# 共享日志策略锚点（与 docker-compose.yml 一致），json-file 驱动，
# 单文件 10m、保留 5 个，180 天留存需外部采集（syslog/ELK）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  # 与单机版一致，唯一 bridge 网络，服务名即 DNS（两主机各自独立创建，
  # 跨主机不共享，fms-backend 直连 db 走 5432 宿主端口）
  fms-network:
    driver: bridge

volumes:
  # 与单机版一致，数据卷 / 前端产物卷 / 网关访问日志卷 / Redis AOF 卷
  # （应用主机的共享会话存储，db 主机不启动 fms-redis，卷声明可共存）
  fms-db-data:
  fms-pglog:
  fms-redis-data:
  fms-static:
  fms-logs:

services:
  # fms-db， PostgreSQL 18 数据库（db 主机独有，--profile db）
  # 职责/健康检查/重启策略与单机版完全一致，多机版唯一差异为发布 5432。
  fms-db:
    # 多机版，profiles 隔离，仅 db 主机启动
    profiles: ["db"]
    build: ./deploy/pg
    image: fms-postgres:18
    container_name: fms-db
    networks:
      - fms-network
    restart: unless-stopped
    # 多机版差异，发布 5432:5432 供应用主机直连（仅 db 主机生效）。
    # 安全，必须配合防火墙白名单仅放行应用主机 IP（ufw / New-NetFirewallRule
    # 其余来源一律拒绝。
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      # init 脚本（fms_init.sh）末尾以该值 ALTER ROLE fms_app 对齐 .env 密码
      FMS_DB_PASSWORD: ${FMS_DB_PASSWORD:?请在 .env 设置 FMS_DB_PASSWORD}
      # init 脚本以该值对齐 sec.app_secrets.jwt.secret（PG 签发/后端/网关三处同值）
      FMS_JWT_SECRET: ${FMS_JWT_SECRET:?请在 .env 设置 FMS_JWT_SECRET}
      # 列加密主密钥外部注入（可选，空 = seed 内建占位值，注入须早于种子数据加密写入）
      FMS_MASTER_KEY: ${FMS_MASTER_KEY:-}
    volumes:
      # 与单机版一致，数据卷、SQL 脚本源，只读、唯一 init 入口，只读
      - fms-db-data:/var/lib/postgresql
      # PG 日志独立卷（pgaudit 审计日志随 PG 日志落盘，供外部采集/归档）
      - fms-pglog:/var/log/postgresql
      - ./fms_db_pg:/fms-init:ro
      - ./deploy/init/fms_init.sh:/docker-entrypoint-initdb.d/fms_init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 20s
      retries: 10
      start_period: 30s
    logging: *default-logging

  # fms-pgbouncer， transaction 连接池（应用主机，--profile app）
  # 与单机版差异，DB_HOST 传 ${FMS_DB_HOST}（跨主机时 compose 服务名 fms-db
  # 不可解析，pgbouncer 直连 db 主机 LAN IP 的 5432 宿主端口，防火墙白名单
  # 收敛），后端只连本地 pgbouncer:6432，数据面不出应用主机。
  fms-pgbouncer:
    # 多机版，仅应用主机启动
    profiles: ["app"]
    build: ./deploy/pgbouncer
    image: fms-pgbouncer:1.24
    container_name: fms-pgbouncer
    networks:
      - fms-network
    restart: unless-stopped
    environment:
      # 生成 userlist.txt 的两用户密码（entrypoint 明文写入 userlist.txt，
      # 故 .env 密码应避免双引号，见 deploy/pgbouncer/entrypoint.sh）
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      FMS_DB_PASSWORD: ${FMS_DB_PASSWORD:?请在 .env 设置 FMS_DB_PASSWORD}
      # 多机版差异，db 主机 LAN IP（FMS_DB_HOST 仅多机模式必填），连接目标
      # 是 db 主机的 5432 宿主端口，须防火墙白名单仅放行应用主机 IP
      DB_HOST: ${FMS_DB_HOST:?多机模式请在 .env 设置 FMS_DB_HOST}
    depends_on:
      # 应用主机 --profile app 不启动 fms-db，required: false 必须显式声明
      # （compose ≥2.20 默认 required: true，指向未激活服务会拒绝启动）
      fms-db:
        condition: service_healthy
        required: false
    healthcheck:
      # 探活经池直连后端执行 SELECT 1（比 SHOW VERSION 更真实，同时验证 pgbouncer 建连与主库可达），
      # $${...} 容器内展开（healthcheck 继承服务 environment）
      test: ["CMD-SHELL", "PGPASSWORD=$${FMS_DB_PASSWORD} psql -h 127.0.0.1 -p 6432 -U fms_app -d fms -tAc 'SELECT 1'"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    logging: *default-logging

  # fms-redis， 共享会话存储（应用主机，--profile app）
  # 与单机版完全一致，不发布端口，仅 fms-network 内被 fms-backend 访问
  fms-redis:
    # 多机版，仅应用主机启动
    profiles: ["app"]
    image: redis:7-alpine
    container_name: fms-redis
    networks:
      - fms-network
    restart: unless-stopped
    # command 内 ${...} 由 compose 解析期从 .env 展开（exec argv 需实值），
    # healthcheck 内 $${...} 双重转义留待容器 shell 展开（见 docker-compose.yml）
    command:
      - redis-server
      - --requirepass
      - "${FMS_REDIS_PASSWORD:?请在 .env 设置 FMS_REDIS_PASSWORD}"
      - --appendonly
      - "yes"
    environment:
      # 注入供 healthcheck 使用（healthcheck 继承服务 environment）
      FMS_REDIS_PASSWORD: ${FMS_REDIS_PASSWORD:?请在 .env 设置 FMS_REDIS_PASSWORD}
    volumes:
      # AOF 持久化目录（appendonly yes，会话键不因重启丢失）
      - fms-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${FMS_REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s
    logging: *default-logging

  # fms-backend， Spring Boot 后端（8081，应用主机，--profile app）
  # 环境/健康检查/重启策略与单机版一致，唯一差异，DB 经本地 pgbouncer 指向
  # db 主机（单机版 pgbouncer 指向服务名 fms-db）。
  # 注意，不发布任何宿主机端口，仅网关 fms-rgw 可达，签名校验必须前置网关。
  fms-backend:
    # 多机版，仅应用主机启动
    profiles: ["app"]
    build: ./fms_backend
    container_name: fms-backend
    networks:
      - fms-network
    restart: unless-stopped
    environment:
      # 多机版差异，后端只连本地 pgbouncer:6432（跨主机时 compose 服务名
      # fms-db 不可解析的问题收敛到 pgbouncer 一层，由 DB_HOST=FMS_DB_HOST
      # 指向 db 主机 LAN IP，FMS_DB_HOST 仅多机模式必填）
      # prepareThreshold=0，PgBouncer transaction 池不支持服务端预编译语句，
      # 禁用后客户端模拟（与单机版同配置，防 PREPARE 协议报错）
      SPRING_DATASOURCE_URL: jdbc:postgresql://fms-pgbouncer:6432/fms?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: fms_app
      SPRING_DATASOURCE_PASSWORD: ${FMS_DB_PASSWORD:?请在 .env 设置 FMS_DB_PASSWORD}
      # 与网关共享的 HMAC 对称密钥（FMS_JWT_SECRET/FMS_RGW_JWT_SECRET 同值）
      FMS_JWT_SECRET: ${FMS_JWT_SECRET:?请在 .env 设置 FMS_JWT_SECRET}
      # 与网关共享的请求签名密钥（FMS_SIGN_SECRET/FMS_RGW_SIGN_SECRET 同值）
      FMS_SIGN_SECRET: ${FMS_SIGN_SECRET:?请在 .env 设置 FMS_SIGN_SECRET}
      # 恒为 false，签名校验必须前置网关，禁止绕过
      FMS_SECURITY_BYPASS_GATEWAY: "false"
      # 网关内部端点 token（/internal/log-batch 头 X-FMS-Int-Token 校验，可选，
      # 默认空 = 内部端点禁用 fail-closed，网关投递配置开启时须在 .env 设置）
      FMS_INTERNAL_TOKEN: ${FMS_INTERNAL_TOKEN:-}
      # 共享会话存储（fms.session-store=redis），会话/防重放/黑名单收敛于
      # 应用主机的 fms-redis，与单机/集群形态同一套会话语义，为后端扩容
      # 多实例铺路，SPRING_DATA_REDIS_* 优先级高于 application.yaml 默认值
      SPRING_DATA_REDIS_HOST: fms-redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${FMS_REDIS_PASSWORD:?请在 .env 设置 FMS_REDIS_PASSWORD}
      FMS_SESSION_STORE: redis
      # 邮件接入，可选，默认不发送，SMTP 配置后找回密码邮件自动生效，未配置静默跳过
      FMS_SMTP_HOST: ${FMS_SMTP_HOST:-}
      FMS_SMTP_PORT: ${FMS_SMTP_PORT:-465}
      FMS_SMTP_USERNAME: ${FMS_SMTP_USERNAME:-}
      FMS_SMTP_PASSWORD: ${FMS_SMTP_PASSWORD:-}
    depends_on:
      # 依赖条件仅对同次启动的服务生效，应用主机 --profile app 不启动 fms-db。
      # required: false 必须显式声明，compose ≥2.20 默认 required: true，
      # 依赖指向 profile 未激活服务会直接报错拒绝启动
      # （"service fms-db is required by fms-backend, but is disabled"）
      fms-db:
        condition: service_healthy
        required: false
      # pgbouncer/redis 与应用主机同 profile，同次启动，依赖为必选
      fms-pgbouncer:
        condition: service_healthy
      fms-redis:
        condition: service_healthy
    # 严禁挂载 fms_backend/config 目录！config/application.yaml 会把
    # server.port 覆盖为 8083 并注入明文 DB 密码，破坏 8081/网关约定。
    healthcheck:
      # /internal/health 经 GatewaySignatureFilter 免签名，可被 compose 探测
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/internal/health"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # fms-web-build， 前端构建一次性服务（应用主机，--profile app）
  # 与单机版完全一致，restart: "no"，每次 up -d 幂等重拷 dist 进 fms-static
  fms-web-build:
    # 多机版，仅应用主机启动
    profiles: ["app"]
    build: ./fms_web
    container_name: fms-web-build
    volumes:
      # 构建产物写入命名卷（fms_web/Dockerfile ENTRYPOINT: cp -r /app/dist/. /static/）
      - fms-static:/static
    restart: "no"
    networks:
      - fms-network

  # fms-rgw， Rust 网关（8443 TLS 入口，应用主机，--profile app）
  # ports/volumes/environment/depends_on 与单机版完全一致，
  #   8443:8443 对外，fms-static / deploy/fms_rgw.yaml / certs / fms-logs 四卷，
  #   FMS_RGW_UPSTREAM=http://fms-backend:8081，容器内服务名。
  fms-rgw:
    # 多机版，仅应用主机启动
    profiles: ["app"]
    build: ./fms_rgw
    image: fms_rgw:0.1.0
    container_name: fms-rgw
    networks:
      - fms-network
    restart: unless-stopped
    # 唯一对外端口（TLS 入口），浏览器/客户端一律先过网关再做签名校验
    ports:
      - "8443:8443"
    volumes:
      # 前端 dist（方案 A，只读静态承载，与 fms-web-build 共用命名卷）
      - fms-static:/app/static:ro
      # 网关配置覆盖镜像内模板（cors.allowed_origins 必须非空，空列表
      # 会被网关 run 校验拒绝 exit，1，该字段无环境变量覆盖点）
      - ./deploy/fms_rgw.yaml:/app/config/fms_rgw.yaml:ro
      # TLS 自签证书只读挂载（缺失 → 启动失败，不依赖 HEALTHCHECK 兜底）
      - ./deploy/certs:/app/certs:ro
      # 访问日志命名卷（/app/logs/access.log，避免 bind mount 与 uid 10001 权限问题）
      - fms-logs:/app/logs
    environment:
      FMS_RGW_CONFIG: /app/config/fms_rgw.yaml
      FMS_RGW_LISTEN: 0.0.0.0:8443
      # 容器内必须为服务名而非 127.0.0.1:8081
      FMS_RGW_UPSTREAM: http://fms-backend:8081
      # 与后端共享密钥（网关 lib.rs:47-68 校验 ≥32 字符且非占位符，违者 exit，1）
      FMS_RGW_JWT_SECRET: ${FMS_JWT_SECRET:?请在 .env 设置 FMS_JWT_SECRET}
      FMS_RGW_SIGN_SECRET: ${FMS_SIGN_SECRET:?请在 .env 设置 FMS_SIGN_SECRET}
      FMS_RGW_STATIC_DIR: /app/static
      FMS_RGW_LOG_FILE: /app/logs/access.log
      # PGMQ 审计链路内部 token（X-FMS-Int-Token 请求头值，必须与后端
      # FMS_INTERNAL_TOKEN 同值，否则后端 40300 拒收、投递仅 WARN 静默丢弃），
      # 空 = 网关日志 PGMQ 投递禁用，默认
      FMS_RGW_LOG_TOKEN: ${FMS_INTERNAL_TOKEN:-}
    depends_on:
      # 等后端健康（service_healthy）且前端产物就绪，构建容器正常退出再启动
      fms-backend:
        condition: service_healthy
      fms-web-build:
        condition: service_completed_successfully
    # 不重复定义 healthcheck，沿用镜像内置（每 30s 探测 /healthz）
    logging: *default-logging
